version: '3.8'

services:
  backend-service:
    build:
      context: .
      dockerfile: backend/Dockerfile.prod
    ports:
      - 9035:80
    environment:
      - IS_SERVER=true
      - ENV_MODE=production
    volumes:
      - /mnt/mountpoint/T1D_Cosmx/figures/spatial_plots/FOV_images_all_cells:/mnt/mountpoint/T1D_Cosmx/figures/spatial_plots/FOV_images_all_cells:ro